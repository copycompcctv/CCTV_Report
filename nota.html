<script>
(function(){
'use strict';
const SUPABASE_URL='https://ogolkyowgvypstjmxxde.supabase.co',KEY='sb_publishable_8NQAMLU4WhrHfn5nwf4gjQ_rr9egknn';
const sb=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let user=null,source='CCTV',sources=[],invoices=[],currentId=null;const LOCAL_INVOICES='cc_nota_tagihan_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function lineText(it){if(it.kind==='text')return (it.text||'').trim();if(it.kind==='qty')return [it.label,it.qty].filter(Boolean).join(' : ');if(it.kind==='cable')return [it.label,it.expr||it.text,it.unit].filter(Boolean).join(' : ');if(it.kind==='structured'){let name=it.item==='Isi Sendiri'?(it.itemCustom||''):it.item;return [name,it.note].filter(Boolean).join(' : ')}return [it.label,it.text,it.note].filter(Boolean).join(' : ')}
function reportLines(r){let out=[],other=[];(r.sections||[]).forEach(s=>{let job=String(s.job||s.title||'').trim();if(job==='Servis Lainnya'){if(String(s.jobCustom||'').trim())other.push(String(s.jobCustom).trim())}else if(job&&job!=='Rincian pekerjaan')out.push(job);(s.items||[]).forEach(it=>{let t=lineText(it);if(t)out.push(t)})});return {lines:out.filter(Boolean),other:other.join('; ')}}
function serviceLines(j){let device=((j.jenis==='Lainnya'?(j.customType||'Lainnya'):j.jenis)||'Perangkat')+' '+(j.model||'');return ['Jasa servis — '+device.trim()]}
function orderLines(o){let detail=String(o.detail||o.jenis||'').trim();if(!detail)return [];if(o.jumlah&&String(o.jumlah).trim())detail+=' × '+String(o.jumlah).trim();return [detail]}
function selectedSource(){return sources.find(x=>x.key===$('sourceSelect').value)}
function renderSources(){let list=sources.filter(x=>x.kind===source).slice().sort((a,b)=>(b.time||0)-(a.time||0));$('sourceSelect').innerHTML='<option value="">Pilih laporan...</option>'+list.map(x=>'<option value="'+esc(x.key)+'">'+esc(x.customer+' — '+x.dateLabel+' ('+x.ticket+')')+'</option>').join('')}
function populate(){let x=selectedSource();if(!x)return;currentId=null;$('invoiceNo').value='CC-'+Date.now().toString().slice(-8);$('invoiceDate').value=today();$('customer').value=x.customer||'';$('address').value=x.address||'';$('phone').value=x.phone||'';$('extra').value=x.other||'';$('sourceInfo').textContent='Sumber: '+x.kind+' • '+x.dateLabel+' • '+x.lines.length+' item tagihan';$('items').innerHTML='';x.lines.forEach(t=>addItem(t));if(!x.lines.length)addItem('');calc();$('invoiceMeta').textContent='Sumber '+x.kind+' • '+x.dateLabel+' • '+x.ticket}
function addItem(desc){let div=document.createElement('div');div.className='item';div.innerHTML='<div class="itemgrid"><input class="description" aria-label="Pekerjaan atau item barang" placeholder="Pekerjaan / item barang" value="'+esc(desc||'')+'"><input class="amount" type="number" min="0" step="1" inputmode="numeric" aria-label="Nominal rupiah" placeholder="Nominal (Rp)"><button type="button" class="secondary noprint remove">Hapus</button></div>';div.querySelectorAll('input').forEach(el=>el.addEventListener('input',calc));div.querySelector('.remove').addEventListener('click',()=>{div.remove();calc()});$('items').appendChild(div);calc()}
function clearInvoiceForm(){currentId=null;$('sourceSelect').value='';$('invoiceNo').value='';$('invoiceDate').value='';['customer','address','phone','extra','paymentNote','downPayment'].forEach(id=>$(id).value='');$('items').replaceChildren();$('sourceInfo').textContent='Pilih laporan untuk mengisi data nota secara otomatis.';$('invoiceMeta').textContent='';$('printCustomer').textContent='';$('printExtra').textContent='';$('grandTotal').textContent='Rp 0';$('dpTotal').textContent='Rp 0';$('balance').textContent='Rp 0';note('Semua isian nota sudah dibersihkan. Pilih laporan jika ingin mengisi ulang. Riwayat nota tersimpan tetap aman.',true)}
function itemData(){return [...$('items').querySelectorAll('.item')].map(el=>({description:el.querySelector('.description').value,amount:number(el.querySelector('.amount').value)})).filter(i=>i.description.trim()||i.amount>0)}
function calc(){$('printCustomer').innerHTML='<b>Pelanggan:</b> '+esc($('customer').value)+'<br><b>Alamat:</b> '+esc($('address').value||'-')+'<br><b>Tanggal nota:</b> '+esc($('invoiceDate').value||today())+'<br><b>Nomor:</b> '+esc($('invoiceNo').value||'-');let sum=[...$('items').querySelectorAll('.item')].reduce((v,el)=>v+number(el.querySelector('.amount').value),0);let dp=number($('downPayment').value);$('grandTotal').textContent=rupiah(sum);$('dpTotal').textContent=rupiah(dp);$('balance').textContent=rupiah(Math.max(0,sum-dp));$('printExtra').textContent=$('extra').value?('Servis lainnya: '+$('extra').value):''}
function readLocalInvoices(){try{return JSON.parse(localStorage.getItem(LOCAL_INVOICES)||'[]')}catch(e){return []}}function writeLocalInvoices(){localStorage.setItem(LOCAL_INVOICES,JSON.stringify(invoices))}function mergeInvoices(list){let m=new Map(invoices.map(x=>[x.id,x]));(list||[]).forEach(x=>{if(x&&x.id)m.set(x.id,x)});invoices=[...m.values()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));writeLocalInvoices()}function renderInvoices(){
 const list=$('invoiceList');
 list.innerHTML=invoices.length?invoices.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(i=>'<div class="listcard"><b>'+esc(i.invoiceNo)+' • '+esc(i.customer)+'</b><span class="muted">'+esc(i.invoiceDate)+' • '+rupiah(i.total)+'</span><div class="actions"><button type="button" class="secondary" data-history-action="open" data-id="'+esc(i.id)+'">Buka</button><button type="button" class="secondary" data-history-action="print" data-id="'+esc(i.id)+'">Cetak</button><button type="button" class="secondary" data-history-action="delete" data-id="'+esc(i.id)+'" style="color:#b42318">Hapus</button></div></div>').join(''):'<div class="empty">Belum ada nota tersimpan.</div>';
 list.querySelectorAll('button[data-history-action]').forEach(btn=>{
  btn.addEventListener('click',async()=>{
   const action=btn.dataset.historyAction,id=btn.dataset.id;
   if(action==='open'){openInvoice(id,false);return}
   if(action==='print'){openInvoice(id,true);return}
   if(action==='delete'){
    if(!confirm('Hapus nota ini dari riwayat?'))return;
    invoices=invoices.filter(x=>String(x.id)!==String(id));writeLocalInvoices();renderInvoices();
    try{if(user){const {error}=await sb.from('service_records').delete().eq('id',id).eq('record_type','invoice');if(error)throw error}note('Nota dihapus dari riwayat.',true)}
    catch(e){note('Nota dihapus dari perangkat ini, tetapi penghapusan online gagal: '+e.message,false)}
   }
  });
 });
}
function currentInvoice(){let x=selectedSource(),items=itemData();return {id:currentId||('invoice:'+Date.now()),invoiceNo:$('invoiceNo').value||('CC-'+Date.now()),invoiceDate:$('invoiceDate').value||today(),customer:$('customer').value,address:$('address').value,phone:$('phone').value,extra:$('extra').value,paymentNote:$('paymentNote').value,downPayment:number($('downPayment').value),items,total:items.reduce((sum,i)=>sum+i.amount,0),sourceType:x?.kind||'Manual',sourceKey:x?.key||'',createdAt:Date.now()}}
async function saveInvoice(){const btn=$('saveBtn');btn.disabled=true;btn.textContent='Menyimpan...';try{let inv=currentInvoice();if(!inv.customer.trim())throw new Error('Nama pelanggan belum diisi.');if(!inv.items.length)throw new Error('Belum ada pekerjaan atau barang yang ditagihkan.');if(!inv.id||inv.id==='invoice:undefined')inv.id='invoice:'+Date.now();inv.createdAt=inv.createdAt||Date.now();let row={id:inv.id,record_type:'invoice',payload:inv,updated_at:new Date().toISOString()};try{if(!user)throw new Error('Sesi login belum aktif.');let {error}=await sb.from('service_records').upsert(row,{onConflict:'id'});if(error)throw error;mergeInvoices([inv]);currentId=inv.id;renderInvoices();note('Nota berhasil disimpan ONLINE. Riwayat nota sudah diperbarui.',true)}catch(cloudError){mergeInvoices([inv]);currentId=inv.id;renderInvoices();note('Nota tersimpan di perangkat ini, tetapi belum tersinkron online: '+(cloudError.message||cloudError),false)}}catch(e){note('Tidak dapat menyimpan nota: '+e.message,false)}finally{btn.disabled=false;btn.textContent='Simpan Nota'}}
function openInvoice(id,autoPrint){
 try{

  const oldStyle=document.getElementById('invoicePreviewStyle');if(oldStyle)oldStyle.remove();
  style.textContent=`
   #invoicePreviewModal{position:fixed;inset:0;z-index:2147483000;background:rgba(20,30,42,.72);overflow:auto;padding:18px;font:13px Arial,sans-serif;color:#111;display:block}

   }`;
  document.head.appendChild(style);
  const rows=(inv.items||[]).map(i=>{const amount=i.amount!=null?(Number(i.amount)||0):(Number(i.qty)||1)*(Number(i.price)||0);return '<tr><td>'+esc(i.description||'-')+'</td><td class="num">'+rupiah(amount)+'</td></tr>'}).join('');
  const total=Number(inv.total)||0,dp=Number(inv.downPayment)||0;
  const logo=new URL('./logo-copy-computer.PNG',window.location.href).href;
  modal.innerHTML='<div class="sheet"><div class="brand"><img src="'+logo+'" alt="Logo Copy Computer"><div><h1>COPY COMPUTER</h1><div>Jl. Sicengkir No. 3 Troso, Kec. Pecangaan Kab. Jepara 59462</div><b>NOTA TAGIHAN</b></div></div><div class="meta">Nomor: '+esc(inv.invoiceNo)+' • Tanggal: '+esc(inv.invoiceDate||'-')+' • Sumber: '+esc(inv.sourceType||'-')+'</div><div class="customer">'+[['Pelanggan',inv.customer],['Alamat',inv.address],['WhatsApp',inv.phone]].filter(x=>x[1]).map(x=>'<div class="info-row"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div><table><thead><tr><th>Uraian pekerjaan / barang</th><th class="num">Nominal</th></tr></thead><tbody>'+rows+'</tbody></table><section class="totals"><div><span>Total tagihan</span><b>'+rupiah(total)+'</b></div><div><span>Uang muka</span><b>'+rupiah(dp)+'</b></div><div class="balance"><span>Sisa tagihan</span><b>'+rupiah(Math.max(0,total-dp))+'</b></div></section>'+(inv.paymentNote?'<div class="extra-row"><b>Pembayaran</b><span>'+esc(inv.paymentNote)+'</span></div>':'')+(inv.extra?'<div class="extra-row"><b>Servis lainnya</b><span>'+esc(inv.extra)+'</span></div>':'')+'</div><div class="controls"><button class="close" type="button" id="closeInvoicePreview">Tutup</button><button type="button" id="printInvoicePreview">Cetak / Simpan PDF</button></div>';
  document.body.appendChild(modal);
  modal.querySelector('#closeInvoicePreview').addEventListener('click',()=>{modal.remove();const st=document.getElementById('invoicePreviewStyle');if(st)st.remove()});

 }catch(e){note('Gagal membuka nota: '+(e&&e.message?e.message:String(e)),false);console.error(e)}

function loadInvoice(id){let inv=invoices.find(x=>x.id===id);if(!inv)return;currentId=inv.id;$('invoiceNo').value=inv.invoiceNo;$('invoiceDate').value=inv.invoiceDate;$('customer').value=inv.customer;$('address').value=inv.address||'';$('phone').value=inv.phone||'';$('extra').value=inv.extra||'';$('paymentNote').value=inv.paymentNote||'';$('downPayment').value=inv.downPayment||'';$('items').innerHTML='';(inv.items||[]).forEach(i=>{addItem(i.description);let el=$('items').lastElementChild;el.querySelector('.amount').value=i.amount!=null?i.amount:(Number(i.qty)||1)*(Number(i.price)||0)});$('invoiceMeta').textContent='Nomor '+inv.invoiceNo+' • '+inv.invoiceDate+' • '+(inv.sourceType||'');calc();window.scrollTo({top:0,behavior:'smooth'})}
async function loadData(){invoices=readLocalInvoices();renderInvoices();let {data:sessionData,error:se}=await sb.auth.getSession();if(se)throw se;user=sessionData.session?.user;if(!user){note('Riwayat nota lokal ditampilkan. Untuk mengambil laporan dan menyimpan online, login melalui Laporan CCTV atau Manajemen Servis.',false);$('sourceSelect').innerHTML='<option>Login diperlukan</option>';return}
let [rr,sr]=await Promise.all([sb.from('reports').select('id,payload,created_at'),sb.from('service_records').select('id,record_type,payload')]);if(rr.error)throw rr.error;if(sr.error)throw sr.error;
sources=[];(rr.data||[]).forEach(row=>{let r=row.payload||{};if(!r.customer)return;let mapped=reportLines(r);sources.push({key:'cctv:'+row.id,kind:'CCTV',ticket:r.customer,customer:r.customer,address:r.address||'',phone:'',dateLabel:r.date||'',time:row.created_at?Date.parse(row.created_at):Number(r.createdAt)||0,lines:mapped.lines,other:mapped.other})});
(sr.data||[]).forEach(row=>{if(row.record_type==='service'){let j=row.payload||{};sources.push({key:'service:'+j.id,kind:'Servisan',ticket:j.ticket||j.id,customer:j.nama||'',address:'',phone:j.wa||'',dateLabel:j.date||'',time:Number(j.id)||Date.parse(j.date||'')||0,lines:serviceLines(j),other:''})}if(row.record_type==='order'){let o=row.payload||{};sources.push({key:'order:'+o.id,kind:'Pesanan Khusus',ticket:o.ticket||o.id,customer:o.nama||'',address:'',phone:o.wa||'',dateLabel:o.date||'',time:Number(o.id)||Date.parse(o.date||'')||0,lines:orderLines(o)})}if(row.record_type==='invoice'&&row.payload)invoices.push(row.payload)});
mergeInvoices(invoices);renderSources();renderInvoices();note('Data laporan dan riwayat nota berhasil dimuat. Pilih sumber laporan untuk mulai membuat nota.',true)}
function setSource(kind){source=kind;['CCTV','Pesanan Khusus','Servisan'].forEach(k=>{const el=$(k==='CCTV'?'cctvTab':k==='Servisan'?'serviceTab':'orderTab');el.classList.toggle('active',k===kind);el.classList.toggle('secondary',k!==kind)});$('sourceSelect').value='';renderSources();$('sourceInfo').textContent=kind==='CCTV'?'Pilih laporan CCTV.':kind==='Servisan'?'Pilih data servisan.':'Pilih data pesanan khusus.'}
$('cctvTab').onclick=()=>setSource('CCTV');$('orderTab').onclick=()=>setSource('Pesanan Khusus');$('serviceTab').onclick=()=>setSource('Servisan');
$('sourceSelect').onchange=populate;$('addItem').onclick=()=>addItem('');$('downPayment').oninput=calc;$('extra').oninput=calc;['customer','address','invoiceDate','invoiceNo'].forEach(id=>$(id).addEventListener('input',calc));$('resetBtn').onclick=clearInvoiceForm;$('saveBtn').onclick=saveInvoice;
loadData().catch(e=>note('Gagal memuat data: '+e.message,false));
})();
