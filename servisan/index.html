<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Manajemen Servis | Copy Computer</title>
<style>
:root{--blue:#1768e8;--navy:#10265a;--muted:#718096;--line:#e5ebf4}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#17243b;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{min-height:72px;padding:10px max(18px,calc((100% - 1080px)/2));display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line)}
header img{width:62px;height:auto;max-height:48px;object-fit:contain}header strong{display:block;color:var(--navy);font-size:16px;letter-spacing:.02em}header small{display:block;color:var(--blue);font-size:12px}
.nav{margin-left:auto;display:flex;gap:8px}.nav a{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;color:#174a9c;background:#f5f8ff;text-decoration:none}.nav svg{width:19px;height:19px}
main{width:min(900px,calc(100% - 32px));margin:46px auto}.intro{margin-bottom:24px}h1{font-size:25px;line-height:1.2;color:var(--navy);margin:0 0 7px}.intro p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-height:155px;border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}.card[href]:hover{border-color:#9dbcf4;transform:translateY(-2px)}.ico{width:42px;height:42px;border-radius:12px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;margin-bottom:15px}.ico svg{width:22px;height:22px}.card b{font-size:16px;color:var(--navy)}.card span{font-size:13px;color:var(--muted);margin-top:4px}.card.disabled{background:#fafbfd;border-style:dashed}.soon{margin-top:auto;padding-top:12px;font-size:11px!important;color:#9aa5b5!important}
@media(max-width:650px){main{margin:30px auto}.cards{grid-template-columns:1fr}.card{min-height:116px;padding:16px;display:grid;grid-template-columns:44px 1fr;column-gap:13px;align-items:center}.ico{grid-row:1/3;margin:0}.card b{align-self:end}.card span{align-self:start;margin-top:2px}.soon{grid-column:2;padding-top:4px}}
</style>
</head>
<body>
<header><img src="../logo-copy-computer.PNG" alt="Logo Copy Computer"><div><strong>COPY COMPUTER</strong><small>Manajemen Servis</small></div><nav class="nav"><a href="../" aria-label="Menu utama" title="Menu utama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></a></nav></header>
<main><div class="intro"><h1>Manajemen Servis</h1><p>Pilih menu yang ingin dibuka.</p></div>
<section class="cards">
<a class="card" href="app.html"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></div><b>Data Servis</b><span>Tambah dan kelola penerimaan servis</span></a>
<a class="card" href="app.html#jobs"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></div><b>Riwayat Servis</b><span>Lihat antrean dan riwayat perbaikan</span></a>
<a class="card" href="app.html#settings"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8z"/></svg></div><b>Pengaturan</b><span>Tambah, ubah, atau kelola status servis</span></a>
</section></main>
</body></html>
