<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Manajemen Servis | Copy Computer</title>
<style>
:root{--blue:#1768e8;--navy:#10265a;--muted:#718096;--line:#e5ebf4}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#17243b;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{min-height:86px;padding:12px max(24px,calc((100% - 1480px)/2));display:flex;align-items:center;gap:18px;border:1px solid #dfe8ff;border-radius:24px;margin:18px auto;max-width:1500px;box-shadow:0 6px 20px rgba(24,78,160,.07)}
header img{width:92px;height:auto;max-height:68px;object-fit:contain;border-right:3px solid #10265a;padding-right:18px}header strong{display:block;color:var(--navy);font-size:24px;letter-spacing:-.03em}header small{display:block;color:var(--blue);font-size:15px}
.nav{margin-left:auto;display:flex;gap:12px}.nav a{width:76px;height:76px;border:1px solid #dfe8fb;border-radius:25px;display:grid;place-items:center;color:#174a9c;background:#f2f6ff;text-decoration:none}.nav svg{width:38px;height:38px}
main{width:min(1420px,calc(100% - 56px));margin:68px auto}.intro{margin-bottom:30px}h1{font-size:36px;line-height:1.2;color:var(--navy);margin:0 0 7px}.intro p{margin:0;color:var(--muted);font-size:20px}
.cards{display:grid;grid-template-columns:1fr;gap:28px}.card{min-width:0;min-height:178px;border:1px solid #dce7ff;border-radius:34px;padding:22px 34px;background:#fff;display:grid;grid-template-columns:176px 1fr 38px;grid-template-rows:auto auto;column-gap:36px;align-items:center;text-align:left;text-decoration:none;color:inherit;box-shadow:0 8px 24px rgba(21,63,132,.08);transition:transform .15s,box-shadow .15s}.card[href]:hover{border-color:#b9cef4;transform:translateY(-2px);box-shadow:0 12px 28px rgba(21,63,132,.1)}.ico{width:148px;height:148px;border-radius:34px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;margin:0;grid-row:1/3}.ico svg{width:94px;height:94px}.card b{font-size:36px;line-height:1.2;color:var(--navy);align-self:end}.card span{font-size:24px;color:#6872b5;margin-top:4px;align-self:start}.card:after{content:'›';grid-column:3;grid-row:1/3;color:var(--blue);font-size:64px;font-weight:300;justify-self:center}.card.disabled{background:#fafbfd;border-style:dashed}.soon{margin-top:auto;padding-top:12px;font-size:11px!important;color:#9aa5b5!important}
@media(max-width:650px){header{min-height:76px;margin:14px 12px;padding:8px 12px;gap:10px}header img{width:62px;max-height:48px;padding-right:10px;border-right-width:2px}header strong{font-size:17px}header small{font-size:12px}.nav{gap:7px}.nav a{width:48px;height:48px;border-radius:16px}.nav svg{width:24px;height:24px}main{width:calc(100% - 32px);margin:46px auto}.intro{margin-bottom:20px}h1{font-size:26px}.cards{grid-template-columns:1fr;gap:18px}.card{min-height:180px;padding:18px 18px;display:grid;grid-template-columns:112px minmax(0,1fr) 20px;grid-template-rows:auto auto;column-gap:20px;row-gap:4px;align-items:center;text-align:left;border-radius:30px}.ico{grid-row:1/3;width:108px;height:108px;border-radius:26px;margin:0}.ico svg{width:70px;height:70px}.card b{font-size:clamp(21px,5.2vw,28px);align-self:end}.card span{font-size:clamp(15px,3.8vw,19px);align-self:start;margin-top:2px}.card:after{font-size:42px;grid-column:3;grid-row:1/3}.soon{grid-column:2;padding-top:4px}}
</style>
</head>
<body>
<header><img src="../logo-copy-computer.PNG" alt="Logo Copy Computer"><div><strong>COPY COMPUTER</strong><small>Manajemen Servis</small></div><nav class="nav"><a href="../" aria-label="Menu utama" title="Menu utama"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.7 12 3l9 7.7v9.1a1.2 1.2 0 0 1-1.2 1.2h-5.1v-6.3H9.3V21H4.2A1.2 1.2 0 0 1 3 19.8z"/></svg></a><a href="javascript:history.back()" aria-label="Kembali" title="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a></nav></header>
<main><div class="intro"><h1>Manajemen Servis</h1><p>Pilih menu yang ingin dibuka.</p></div>
<section class="cards">
<a class="card" href="app.html"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></div><b>Data Servis</b><span>Tambah dan kelola penerimaan servis</span></a>
<a class="card" href="app.html#jobs"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></div><b>Riwayat Servis</b><span>Lihat antrean dan riwayat perbaikan</span></a>
<a class="card" href="app.html#settings"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8z"/></svg></div><b>Pengaturan</b><span>Tambah, ubah, atau kelola status servis</span></a>
</section></main>
</body></html>
