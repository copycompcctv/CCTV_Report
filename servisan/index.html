<style>html.cc-gate-pending body{visibility:hidden}</style><script>
(function(){
'use strict';
document.documentElement.classList.add('cc-gate-pending');
var IDLE_LIMIT=5*60*1000,last=Number(localStorage.getItem('cc_last_activity'))||0;
function expire(){sessionStorage.removeItem('cc_app_unlocked');localStorage.removeItem('cc_last_activity');location.replace('../')}
function checkIdle(){last=Number(localStorage.getItem('cc_last_activity'))||0;if(sessionStorage.getItem('cc_app_unlocked')!=='1'||!last||Date.now()-last>=IDLE_LIMIT)expire()}
if(sessionStorage.getItem('cc_app_unlocked')!=='1'||!last||Date.now()-last>=IDLE_LIMIT){expire();return}
function touch(){var n=Date.now();if(n-last>900){last=n;localStorage.setItem('cc_last_activity',String(n))}}
['pointerdown','keydown','touchstart','click','scroll'].forEach(function(e){document.addEventListener(e,touch,{passive:true})});
setInterval(checkIdle,1000);document.addEventListener('visibilitychange',function(){if(!document.hidden)checkIdle()});
document.documentElement.classList.remove('cc-gate-pending');
})();
</script><style id="iphone-viewport-fit">

body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
main,.cards,.card{min-width:0;max-width:100%}

  .card .ico{width:clamp(54px,16vw,70px);height:clamp(54px,16vw,70px)}
  .card b,.card span{min-width:0;overflow-wrap:anywhere}
}
