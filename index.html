<style>
:root{color-scheme:light;--navy:#10265a;--blue:#1768e8;--cyan:#06b8d2;--muted:#71809a;--line:#e4ebf5;--soft:#f4f8ff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:10px max(18px,calc((100% - 1120px)/2))}
header img{display:block;width:68px;height:auto;max-height:52px;object-fit:contain;flex:none}
header strong{font-size:20px;letter-spacing:-.02em;font-weight:750;color:var(--navy)}
header strong span{color:var(--blue)}
main{width:min(1540px,100%);margin:148px auto 30px;padding:0 34px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
.module{min-width:0;min-height:360px;padding:26px 24px 30px;background:#fff;border:1px solid #dce7ff;border-radius:48px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 12px 28px rgba(21,82,190,.12);transition:transform .15s,box-shadow .15s}
.module:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(21,63,132,.1)}
.symbol{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:#f0f6ff;color:var(--blue);margin-bottom:22px}
.symbol svg{width:142px;height:142px;display:block}
.module h2{font-size:38px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.035em}
.module h2 span{color:var(--blue)}

@media(max-width:680px){header{height:76px;padding:8px 18px}header img{width:66px;max-height:50px}header strong{font-size:19px}main{margin:54px auto 24px;padding:0 18px}.menu{grid-template-columns:1fr;gap:18px}.module{min-height:170px;display:grid;grid-template-columns:118px 1fr;grid-template-rows:auto;column-gap:22px;align-items:center;text-align:left;padding:22px 24px;border-radius:30px}.symbol{grid-row:1;width:112px;height:112px;margin:0}.symbol svg{width:72px;height:72px}.module h2{font-size:clamp(22px,5.5vw,30px);align-self:center}.module:after{content:'›';display:block;grid-column:3;grid-row:1;color:var(--blue);font-size:54px;font-weight:300;margin:0;align-self:center}}
@media(min-width:681px) and (max-width:1100px){main{margin:90px auto 30px;padding:0 22px}.menu{gap:18px}.module{min-height:280px;border-radius:32px}.symbol{width:160px;height:160px}.symbol svg{width:100px;height:100px}.module h2{font-size:clamp(22px,3vw,32px)}}
</style>
</head>

    <h2><span>CCTV</span> Report</h2>
  </a>
