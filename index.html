<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copy Computer</title>
<meta name="description" content="Sistem operasional Copy Computer.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copy Computer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;--navy:#10265a;--blue:#1768e8;--cyan:#06b8d2;--muted:#71809a;--line:#e4ebf5;--soft:#f4f8ff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:10px max(18px,calc((100% - 1120px)/2))}
header img{display:block;width:68px;height:auto;max-height:52px;object-fit:contain;flex:none}
header strong{font-size:20px;letter-spacing:-.02em;font-weight:750;color:var(--navy)}
header strong span{color:var(--blue)}
main{width:min(980px,100%);margin:44px auto 30px;padding:0 20px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.module{min-width:0;min-height:176px;padding:22px 18px 18px;background:#fff;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 8px 24px rgba(21,63,132,.06);transition:transform .15s,box-shadow .15s}
.module:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(21,63,132,.1)}
.symbol{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#edf5ff;color:var(--blue);margin-bottom:12px}
.symbol svg{width:42px;height:42px;display:block}
.module h2{font-size:17px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.02em}
.module h2 span{color:var(--blue)}
.module:after{content:"";width:42px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--blue));margin-top:12px}
@media(max-width:680px){header{height:66px;padding:8px 15px}header img{width:58px;max-height:44px}header strong{font-size:18px}main{margin:24px auto;padding:0 15px}.menu{grid-template-columns:1fr;gap:12px}.module{min-height:94px;display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;column-gap:14px;row-gap:2px;align-items:center;text-align:left;padding:14px 16px}.symbol{grid-row:1/3;width:58px;height:58px;margin:0}.symbol svg{width:32px;height:32px}.module h2{align-self:end}.module:after{grid-column:2;width:34px;margin-top:7px;align-self:start}}
@media(min-width:681px) and (max-width:900px){.menu{gap:12px}.module{padding:18px 12px}}
</style>
</head>
<body>
<header>
  <img src="logo-copy-computer.PNG" alt="Logo asli Copy Computer">
  <strong>COPY <span>COMPUTER</span></strong>
</header>
<main>
<nav class="menu" aria-label="Menu aplikasi">
  <a class="module" href="./cctv.html" aria-label="CCTV Report">
    <div class="symbol" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M7 17.5 32 8l7 5-25 10-7-5Z" fill="currentColor"/><path d="m14 23 25-10v13L14 36V23Z" fill="currentColor" opacity=".9"/><path d="M18 35v5m17-14 5 7m-5-7v-5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M8 17.5v9l6 4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <h2><span>CCTV</span> Report</h2>
  </a>
  <a class="module" href="./servisan/" aria-label="Manajemen Servis">
    <div class="symbol" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="m29 7 3-3a10 10 0 0 1 0 14l-5-5-17 17a4 4 0 0 1-6-6L21 8l-5-5a10 10 0 0 1 13 4Z" fill="currentColor"/><path d="m28 27 5-5 11 11a5 5 0 0 1-7 7L28 29" fill="currentColor" opacity=".85"/></svg></div>
    <h2>Manajemen <span>Servis</span></h2>
  </a>
  <a class="module" href="./nota.html" aria-label="Buat Nota">
    <div class="symbol" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M12 5h19l8 8v29H12a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4Z" fill="currentColor"/><path d="M30 5v9h9M16 21h18M16 28h18M16 35h11" stroke="white" stroke-width="2.8" stroke-linecap="round"/></svg></div>
    <h2>Buat <span>Nota</span></h2>
  </a>
</nav>
</main>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script>
</body>
</html>
