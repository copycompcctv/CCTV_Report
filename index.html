async function loadJeparaWeather(){var temp=document.getElementById('weatherTemp'),desc=document.getElementById('weatherDesc'),icon=document.getElementById('weatherIcon');try{var url='https://api.open-meteo.com/v1/forecast?latitude=-6.59&longitude=110.67&current=temperature_2m,weather_code,is_day&temperature_unit=celsius&timezone=Asia%2FJakarta';var res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('weather unavailable');var data=await res.json();var cur=data.current;if(!cur||typeof cur.temperature_2m!=='number')throw new Error('weather data unavailable');var info=weatherLabels[cur.weather_code]||['Kondisi cuaca terkini','🌤️'];temp.textContent=Math.round(cur.temperature_2m)+'°C';desc.textContent=info[0];icon.textContent=info[1]}catch(e){desc.textContent='Cuaca belum tersedia';icon.textContent='🌤️';temp.textContent='--°C'}}loadJeparaWeather();setInterval(loadJeparaWeather,15*60*1000);

var sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
var login=$('loginPanel'),menu=$('menuPanel'),form=$('welcomeForm'),msg=$('welcomeMessage'),pass=$('welcomePassword');
function $(id){return document.getElementById(id)}
function showLogin(message){login.hidden=false;menu.hidden=true;msg.textContent=message||'';pass.value=''}
var IDLE_LIMIT=5*60*1000,lastTouch=0,locking=false;
function showMenu(){login.hidden=true;menu.hidden=false;sessionStorage.setItem('cc_app_unlocked','1');localStorage.setItem('cc_last_activity',String(Date.now()))}
async function lock(message){if(locking)return;locking=true;sessionStorage.removeItem('cc_app_unlocked');localStorage.removeItem('cc_last_activity');try{await sb.auth.signOut({scope:'local'})}catch(e){}showLogin(message||'Sesi berakhir setelah 5 menit tidak aktif. Masukkan password kembali.');locking=false}
function activity(){if(sessionStorage.getItem('cc_app_unlocked')==='1'){var now=Date.now();if(now-lastTouch>900){localStorage.setItem('cc_last_activity',String(now));lastTouch=now}}}
function checkIdle(){if(sessionStorage.getItem('cc_app_unlocked')==='1'){var last=Number(localStorage.getItem('cc_last_activity'))||0;if(!last||Date.now()-last>=IDLE_LIMIT)lock()}}
['pointerdown','keydown','touchstart','click','scroll'].forEach(function(ev){document.addEventListener(ev,activity,{passive:true})});
setInterval(checkIdle,1000);document.addEventListener('visibilitychange',function(){if(!document.hidden)checkIdle()});
$('togglePassword').addEventListener('click',function(){pass.type=pass.type==='password'?'text':'password'});
form.addEventListener('submit',async function(e){e.preventDefault();var btn=form.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Memeriksa...';msg.textContent='Menghubungkan ke akun Copy Computer...';try{var result=await sb.auth.signInWithPassword({email:EMAIL,password:pass.value});if(result.error)throw result.error;showMenu()}catch(err){msg.textContent='Password salah atau koneksi bermasalah. Coba kembali.';pass.focus()}finally{btn.disabled=false;btn.innerHTML='Masuk <span>→</span>'}});
$('lockButton').addEventListener('click',function(){lock('Aplikasi dikunci. Masukkan password untuk melanjutkan.')});

if(homeInstallBtn&&!isStandalone){
  if(isIosDevice){homeInstallBtn.hidden=false}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installPrompt=e;homeInstallBtn.hidden=false});
  homeInstallBtn.addEventListener('click',async function(){
    if(installPrompt){var promptEvent=installPrompt;installPrompt=null;homeInstallBtn.hidden=true;try{await promptEvent.prompt();await promptEvent.userChoice}catch(e){}}

    else{homeInstallHint.textContent='Buka menu browser, lalu pilih “Instal aplikasi” atau “Tambahkan ke layar utama”.';homeInstallHint.hidden=false}
  });
  window.addEventListener('appinstalled',function(){homeInstallBtn.hidden=true;homeInstallHint.hidden=true});
}
