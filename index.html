<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copy Computer</title>
<meta name="description" content="Sistem operasional Copy Computer.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copy Computer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;--navy:#10265a;--blue:#1768e8;--cyan:#06b8d2;--muted:#71809a;--line:#dfe8f7;--soft:#f4f8ff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{min-height:112px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px max(24px,calc((100% - 1240px)/2))}
header img{display:block;width:104px;height:auto;max-height:82px;object-fit:contain;flex:none;padding-right:16px;border-right:2px solid #10265a}
header strong{font-size:32px;letter-spacing:-.035em;font-weight:800;color:var(--navy)}
header strong span{color:var(--blue)}
main{width:min(1480px,100%);margin:108px auto 48px;padding:0 28px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.module{min-width:0;min-height:292px;padding:28px 20px;background:#fff;border:1px solid #dce7ff;border-radius:28px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 7px 20px rgba(21,82,190,.075);transition:transform .15s,box-shadow .15s}
.module:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(21,63,132,.11)}
.symbol{width:164px;height:164px;border-radius:50%;display:grid;place-items:center;background:#f0f6ff;color:var(--blue);margin-bottom:20px}
.symbol svg{width:104px;height:104px;display:block}
.module h2{font-size:33px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.03em}
.module h2 span{color:var(--blue)}
@media(max-width:680px){
 header{min-height:76px;padding:8px 16px;gap:12px}header img{width:64px;max-height:50px;padding-right:10px;border-right-width:2px}header strong{font-size:20px}
 main{margin:38px auto 26px;padding:0 16px}
 .menu{grid-template-columns:1fr;gap:14px}
 .module{min-height:126px;display:grid;grid-template-columns:82px minmax(0,1fr) 20px;grid-template-rows:auto;column-gap:16px;align-items:center;text-align:left;padding:14px 16px;border-radius:22px}
 .symbol{grid-row:1;width:78px;height:78px;margin:0}.symbol svg{width:52px;height:52px}
 .module h2{font-size:clamp(19px,5vw,24px);align-self:center}
 .module:after{content:'›';display:block;grid-column:3;grid-row:1;color:var(--blue);font-size:40px;font-weight:300;align-self:center}
}
@media(min-width:681px) and (max-width:980px){
 header{min-height:82px;padding:10px 20px}header img{width:76px;max-height:58px}header strong{font-size:24px}
 main{margin:70px auto 30px;padding:0 20px}.menu{gap:18px}.module{min-height:240px;border-radius:24px}.symbol{width:126px;height:126px}.symbol svg{width:82px;height:82px}.module h2{font-size:clamp(20px,2.6vw,26px)}
}

/* Responsive sizing: approved Copy Computer style, normal app proportions */
header{min-height:88px;max-width:1200px;padding:10px 22px;gap:16px;border:1px solid var(--line);border-radius:22px;margin:16px auto;box-shadow:0 4px 14px rgba(21,82,190,.06)}
header img{width:82px;max-height:62px;padding-right:14px;border-right:2px solid var(--navy)}
header strong{font-size:25px}
main{width:min(1160px,100%);margin:58px auto 42px;padding:0 24px}
.menu{gap:20px}
.module{min-height:220px;padding:22px 16px;border-radius:24px;box-shadow:0 5px 16px rgba(21,82,190,.07)}
.symbol{width:112px;height:112px;margin-bottom:14px}
.symbol svg{width:72px;height:72px}
.module h2{font-size:25px}
@media(min-width:681px) and (max-width:980px){
 header{margin:14px 18px}main{margin:42px auto;padding:0 18px}
 .menu{gap:14px}.module{min-height:190px;padding:18px 10px}.symbol{width:94px;height:94px}.symbol svg{width:62px;height:62px}.module h2{font-size:clamp(18px,2.4vw,22px)}
}
@media(max-width:680px){
 header{min-height:70px;margin:10px 12px;padding:7px 10px;gap:9px;border-radius:18px}
 header img{width:58px;max-height:44px;padding-right:9px}
 header strong{font-size:17px}
 main{margin:28px auto 24px;padding:0 14px}
 .menu{grid-template-columns:1fr;gap:12px}
 .module{min-height:104px;padding:12px 13px;grid-template-columns:72px minmax(0,1fr) 18px;column-gap:13px;border-radius:18px}
 .symbol{width:68px;height:68px;margin:0;border-radius:18px}.symbol svg{width:46px;height:46px}
 .module h2{font-size:clamp(18px,4.8vw,22px)}
 .module:after{font-size:34px}
}

</style>
</head>

<header>

<main>

    <h2>Buat <span>Nota</span></h2>
  </a>
</nav>
</main>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
