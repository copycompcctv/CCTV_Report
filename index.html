<style>
:root{color-scheme:light;--navy:#10265a;--blue:#1768e8;--cyan:#06b8d2;--muted:#71809a;--line:#dfe8f7;--soft:#f4f8ff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{min-height:92px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px max(24px,calc((100% - 1240px)/2))}
header img{display:block;width:86px;height:auto;max-height:68px;object-fit:contain;flex:none;padding-right:16px;border-right:2px solid #10265a}
header strong{font-size:27px;letter-spacing:-.035em;font-weight:800;color:var(--navy)}
header strong span{color:var(--blue)}
main{width:min(1240px,100%);margin:66px auto 40px;padding:0 28px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.module{min-width:0;min-height:238px;padding:24px 18px;background:#fff;border:1px solid #dce7ff;border-radius:28px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 7px 20px rgba(21,82,190,.075);transition:transform .15s,box-shadow .15s}
.module:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(21,63,132,.11)}
.symbol{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:#f0f6ff;color:var(--blue);margin-bottom:16px}
.symbol svg{width:70px;height:70px;display:block}
.module h2{font-size:25px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.03em}
.module h2 span{color:var(--blue)}
@media(max-width:680px){
 header{min-height:76px;padding:8px 16px;gap:12px}header img{width:64px;max-height:50px;padding-right:10px;border-right-width:2px}header strong{font-size:20px}
 main{margin:34px auto 26px;padding:0 16px}
 .menu{grid-template-columns:1fr;gap:14px}
 .module{min-height:126px;display:grid;grid-template-columns:82px minmax(0,1fr) 20px;grid-template-rows:auto;column-gap:16px;align-items:center;text-align:left;padding:14px 16px;border-radius:22px}
 .symbol{grid-row:1;width:78px;height:78px;margin:0}.symbol svg{width:52px;height:52px}
 .module h2{font-size:clamp(19px,5vw,24px);align-self:center}
 .module:after{content:'›';display:block;grid-column:3;grid-row:1;color:var(--blue);font-size:40px;font-weight:300;align-self:center}
}
@media(min-width:681px) and (max-width:980px){
 header{min-height:82px;padding:10px 20px}header img{width:76px;max-height:58px}header strong{font-size:24px}
 main{margin:54px auto 30px;padding:0 20px}.menu{gap:16px}.module{min-height:210px;border-radius:24px}.symbol{width:94px;height:94px}.symbol svg{width:60px;height:60px}.module h2{font-size:clamp(18px,2.6vw,23px)}
}
